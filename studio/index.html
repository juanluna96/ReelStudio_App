<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reel Studio</title>
    <link rel="icon" type="image/svg+xml" href="/desktop/icon/favicon.svg" />
    <!-- Theme before the first paint (store/useThemeStore.ts keeps it in sync afterwards): no flash. -->
    <script>
      (function () {
        var p = 'system';
        try { p = localStorage.getItem('studio.theme') || 'system'; } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
